[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-multi-agent-airport-operations-simulator"
version = "1.0.0"
description = "AI Multi-Agent Airport Operations Simulator backend project"
license = {text = "Educational personal project"}
requires-python = ">=3.11"
authors = [
  {name = "Student Project"}
]
keywords = [
  "airport",
  "simulation",
  "multi-agent",
  "fastapi",
  "redis",
  "postgresql",
  "celery",
  "websocket",
  "or-tools",
  "openai",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "celery>=5.4",
  "ortools>=9.10",
  "openai>=1.50",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "websockets>=13.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]
dev = [
  "ruff>=0.7",
  "mypy>=1.12",
  "types-redis>=4.6",
]

[project.scripts]
airport-api = "app.main:app_info"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]
markers = [
  "engine: simulation engine tests",
  "api: REST API tests",
  "schedule: scheduler tests",
  "slow: longer simulation tests",
  "database: database tests",
  "redis: redis tests",
  "ai: AI advisory tests",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "tests/*",
  "saved_data/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "saved_data",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
]
ignore = [
  "E501",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
exclude = [
  "tests",
  "saved_data",
]

[tool.isort]
profile = "black"
line_length = 140
known_first_party = ["app"]

[tool.black]
line-length = 140
target-version = ["py311"]
include = '\.pyi?$'
exclude = "saved_data"

[tool.taskipy.tasks]
start = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
dev = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
test = "pytest"
coverage = "pytest --cov=app --cov-report=term-missing"
worker = "celery -A app.tasks.celery_app worker --loglevel=info"
